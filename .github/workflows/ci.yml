name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Run tests
        run: pytest -v --cov=online_store --cov-report=term-missing

      - name: Build package
        run: python -m build

      - name: Check dist artifacts
        run: ls -la dist

      - name: Build Docker image
        run: docker build -t online-store:ci .
